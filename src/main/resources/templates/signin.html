<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng nhập</title><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><div class="card shadow p-4"><h2 class="text-center mb-4">Đăng nhập</h2><div class="alert alert-success" th:if="${param.registered}">Đăng ký thành công.</div><div class="alert alert-warning" th:if="${param.expired}">Phiên đã hết hạn. Vui lòng đăng nhập lại.</div><div class="alert alert-danger" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div><form method="post" action="/signin"><div class="mb-3"><label>Email</label><input class="form-control" type="email" name="username" required></div><div class="mb-3"><label>Mật khẩu</label><input class="form-control" type="password" name="password" required></div><button class="btn btn-primary w-100">Đăng nhập</button></form><p class="text-center mt-3">Chưa có tài khoản? <a href="/signup">Đăng ký</a></p></div></div></div></div></body></html>
