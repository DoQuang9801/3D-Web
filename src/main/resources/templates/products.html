<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Sản phẩm</title><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/dashboard">Quản lý sản phẩm</a><div><a class="btn btn-light btn-sm me-2" href="/dashboard">Dashboard</a><form class="d-inline" method="post" action="/signout"><button class="btn btn-outline-light btn-sm">Đăng xuất</button></form></div></div></nav><div class="container py-4"><div class="d-flex justify-content-between mb-3"><h2>Danh sách sản phẩm</h2><a class="btn btn-success" href="/products/new">+ Thêm sản phẩm</a></div><div class="table-responsive"><table class="table table-bordered bg-white align-middle"><thead class="table-light"><tr><th>ID</th><th>Tên</th><th>Mã</th><th>Danh mục</th><th>Giá</th><th>Số lượng</th><th>Thao tác</th></tr></thead><tbody><tr th:each="p:${products}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.code}"></td><td th:text="${p.category}"></td><td th:text="${p.price}"></td><td th:text="${p.quantity}"></td><td><a class="btn btn-sm btn-warning" th:href="@{'/products/edit/'+${p.id}}">Sửa</a> <a class="btn btn-sm btn-danger" th:href="@{'/products/delete/'+${p.id}}" onclick="return confirm('Xóa sản phẩm?')">Xóa</a></td></tr></tbody></table></div></div></body></html>
