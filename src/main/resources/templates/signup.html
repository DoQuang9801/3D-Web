<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng ký</title><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><div class="card shadow p-4"><h2 class="text-center mb-4">Đăng ký</h2><div class="alert alert-danger" th:if="${param.error}">Email đã tồn tại hoặc mật khẩu phải từ 6 ký tự.</div><form method="post" action="/signup"><div class="mb-3"><label>Email</label><input class="form-control" type="email" name="email" required></div><div class="mb-3"><label>Mật khẩu</label><input class="form-control" type="password" name="password" required></div><div class="mb-3"><label>Nhập lại mật khẩu</label><input class="form-control" type="password" name="confirmPassword" required></div><button class="btn btn-success w-100">Đăng ký</button></form><p class="text-center mt-3"><a href="/signin">Quay lại đăng nhập</a></p></div></div></div></div></body></html>
