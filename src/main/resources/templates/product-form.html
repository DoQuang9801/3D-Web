<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Sản phẩm</title><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container py-5"><div class="card shadow p-4"><h2 th:text="${product.id==null?'Thêm sản phẩm':'Sửa sản phẩm'}">Sản phẩm</h2><form method="post" action="/products/save"><input type="hidden" name="id" th:value="${product.id}"><div class="row"><div class="col-md-6 mb-3"><label>Tên sản phẩm</label><input class="form-control" name="name" th:value="${product.name}" required></div><div class="col-md-6 mb-3"><label>Mã sản phẩm</label><input class="form-control" name="code" th:value="${product.code}" required></div><div class="col-md-6 mb-3"><label>Danh mục</label><input class="form-control" name="category" th:value="${product.category}"></div><div class="col-md-3 mb-3"><label>Giá</label><input class="form-control" type="number" step="0.01" name="price" th:value="${product.price}"></div><div class="col-md-3 mb-3"><label>Số lượng</label><input class="form-control" type="number" name="quantity" th:value="${product.quantity}"></div><div class="col-12 mb-3"><label>Mô tả</label><textarea class="form-control" name="description" rows="3" th:text="${product.description}"></textarea></div></div><button class="btn btn-primary">Lưu</button> <a class="btn btn-secondary" href="/products">Quay lại</a></form></div></div></body></html>
